[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssd-workshop-spike"
version = "0.0.1"
description = "TODO app (Flask + Jinja, SSR, no JS) — scaffolded with a Kanban board as the next step"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
app = ["persistence/schema.sql", "templates/**/*.html", "static/*.css"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "instance", "openspec"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Enforce layer boundaries (see design.md D10).
"flask".msg = "Only app/__init__.py and app/todo/** may import flask. See design.md."

[tool.ruff.lint.per-file-ignores]
# Whitelist the layers that are allowed to import flask.
"app/__init__.py" = ["TID251"]
"app/todo/*" = ["TID251"]
"tests/*" = ["TID251"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
ignore_missing_imports = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
